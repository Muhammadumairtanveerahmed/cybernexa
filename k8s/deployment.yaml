apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybernexa
spec:
  replicas: 1
  strategy:
    type: Recreate          # single ReadWriteOnce uploads volume
  selector:
    matchLabels:
      app: cybernexa
  template:
    metadata:
      labels:
        app: cybernexa
    spec:
      securityContext:
        fsGroup: 1000          # node image user/group — makes the volumes writable
      initContainers:
        # Wait for MySQL to accept connections before the app starts, so the app
        # always uses the database instead of falling back to file storage.
        - name: wait-for-mysql
          image: mysql:8.0
          envFrom:
            - secretRef:
                name: mysql-secret
          command:
            - sh
            - -c
            - until mysqladmin ping -h mysql --silent; do echo "waiting for mysql..."; sleep 3; done
      containers:
        - name: cybernexa
          image: cybernexa:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: cybernexa-env
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 4
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: cybernexa-uploads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cybernexa-uploads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
