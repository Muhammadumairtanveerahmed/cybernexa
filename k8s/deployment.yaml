apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybernexa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cybernexa
  template:
    metadata:
      labels:
        app: cybernexa
    spec:
      securityContext:
        fsGroup: 1000          # node image user/group — makes the uploads volume writable
      containers:
        - name: cybernexa
          image: cybernexa:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: cybernexa-env
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 15
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: cybernexa-uploads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cybernexa-uploads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
