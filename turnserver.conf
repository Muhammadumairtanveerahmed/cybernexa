# TURN Server Configuration for TechNexa
# Public IP: 54.161.79.42   Private IP: 172.31.36.154
# AWS Security Group must allow:     3478 udp/tcp, 49200-49220 udp
#
listening-port=3478
listening-ip=172.31.36.154
relay-ip=172.31.36.154
external-ip=54.161.79.42/172.31.36.154

# Small, fixed relay range so only a narrow UDP range needs to be opened in AWS
min-port=49200
max-port=49220

realm=webnexa.duckdns.org
user=cybernexa:turnpass123

# Security
fingerprint
no-multicast-peers
stale-nonce=600

# Logging
log-file=stdout
simple-log

# Limits
total-quota=100
bps-capacity=0
