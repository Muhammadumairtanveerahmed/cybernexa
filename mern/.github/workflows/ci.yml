name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build React client
        run: npm run build -w client

      - name: Check server syntax
        run: node --check server/src/server.js

      - name: Check migration runner syntax
        run: node --check server/database/migrate.js
