name: technexa-monitoring

# All services use host networking so they can reach the k3s MySQL ClusterIP
# and the k3s app through Traefik.
#
# Public access is served by Traefik (k3s) on port 80 through the
# cybernexa-web / cybernexa-websecure IngressRoutes:
#   Grafana    : http://54.161.79.42/grafana/
#   Prometheus : http://54.161.79.42/prometheus/   (basic auth: admin)
#
# Ports 9090 / 9100 / 9104 / 9115 remain bound to localhost only.
# Prometheus itself listens on 0.0.0.0:9090 so the Traefik pod can reach it
# through the node IP; the AWS Security Group keeps 9090 closed publicly.

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: technexa-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--web.listen-address=127.0.0.1:9100"
    volumes:
      - "/:/host:ro,rslave"

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.14.0
    container_name: technexa-mysqld-exporter
    restart: unless-stopped
    network_mode: host
    environment:
      DATA_SOURCE_NAME: "${MYSQL_EXPORTER_USER}:${MYSQL_EXPORTER_PASSWORD}@(${MYSQL_HOST}:${MYSQL_PORT})/"
    command:
      - "--web.listen-address=127.0.0.1:9104"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: technexa-blackbox-exporter
    restart: unless-stopped
    network_mode: host
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
      - "--web.listen-address=127.0.0.1:9115"
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: technexa-prometheus
    restart: unless-stopped
    network_mode: host
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.listen-address=0.0.0.0:9090"
      - "--web.enable-lifecycle"
      - "--web.external-url=http://54.161.79.42/prometheus/"
      - "--web.route-prefix=/prometheus/"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.3.0
    container_name: technexa-grafana
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: 3001
      GF_SERVER_ROOT_URL: http://54.161.79.42/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/server-overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
