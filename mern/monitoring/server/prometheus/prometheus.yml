global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: technexa-server
    environment: production

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          service: prometheus

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          service: host
          instance: technexa-ec2

  - job_name: mysql
    static_configs:
      - targets: ["127.0.0.1:9104"]
        labels:
          service: mysql

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://127.0.0.1/healthz"
          - "http://127.0.0.1/"
          - "http://54.161.79.42/healthz"
        labels:
          service: website
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
